<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accordeur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Accordeur multi-instruments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Note readout and cents meter first, string buttons under it, settings last. */
:root {
  --bg: #eceff1;
  --surface: #ffffff;
  --ink: #15191d;
  --muted: #56616b;
  --line: #c9d0d6;
  --accent: #c4801a;
  --on-accent: #1a1204;
  --ok: #1d7f47;
  --off: #c2381f;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418;
    --surface: #181d23;
    --ink: #e9edf0;
    --muted: #97a3ad;
    --line: #2a323a;
    --accent: #f0b24a;
    --on-accent: #1a1204;
    --ok: #58cf86;
    --off: #ff7a5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418;
  --surface: #181d23;
  --ink: #e9edf0;
  --muted: #97a3ad;
  --line: #2a323a;
  --accent: #f0b24a;
  --on-accent: #1a1204;
  --ok: #58cf86;
  --off: #ff7a5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 18px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top small { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip {
  flex: 0 0 auto; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.readout { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px 12px; }
.note { font-family: var(--font-display); font-weight: 800; font-size: 104px; line-height: 0.85; letter-spacing: 0.01em; min-width: 0; transition: color .15s; }
.note .oct { font-size: 36px; font-weight: 700; margin-left: 4px; color: var(--muted); }
.note.idle { color: var(--muted); }
.note.ok { color: var(--ok); }
.note.off { color: var(--ink); }
.nums { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 4px; }
.nums .hz { font-size: 20px; font-weight: 500; }
.nums .ct { font-size: 15px; color: var(--muted); }
.nums .tgt { font-size: 12px; color: var(--muted); }

.meter { position: relative; height: 64px; }
.zone { position: absolute; left: 45%; width: 10%; top: 6px; bottom: 22px; background: color-mix(in srgb, var(--ok) 22%, transparent); border-radius: 4px; }
.track { position: absolute; left: 0; right: 0; top: 50%; margin-top: -11px; height: 2px; background: var(--line); }
.ticks { position: absolute; inset: 6px 0 22px 0; }
.tick { position: absolute; bottom: 0; width: 1px; height: 30%; background: var(--line); transform: translateX(-0.5px); }
.tick.big { height: 55%; background: var(--muted); }
.tick.mid { height: 100%; background: var(--ink); width: 2px; transform: translateX(-1px); }
.needle {
  position: absolute; top: 0; bottom: 16px; left: 0; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--accent);
  transform: translateX(0); transition: transform .12s ease-out, opacity .2s, background .15s; will-change: transform;
}
.needle.ok { background: var(--ok); }
.needle.idle { opacity: .25; }
.scale { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.status { min-height: 22px; font-weight: 600; font-size: 15px; text-align: center; }
.status.ok { color: var(--ok); }
.status.off { color: var(--off); }
.status.idle { color: var(--muted); font-weight: 400; }

.strings { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 8px; }
.str {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 0;
}
.str .n { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; }
.str .n .oct { font-size: 16px; color: var(--muted); margin-left: 1px; }
.str .k { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.str[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.str.playing { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.str.playing .oct, .str.playing .k { color: var(--on-accent); }
.str.hit-ok { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { padding: 11px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.grow { flex: 1 1 140px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.stepper button { width: 40px; height: 40px; border: 0; background: transparent; font-size: 20px; }
.stepper output { min-width: 86px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.lbl { color: var(--muted); font-size: 13px; }
.msg { margin: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); }
.msg[hidden] { display: none; }
@media (max-width: 380px) { .note { font-size: 88px; } }
@media (prefers-reduced-motion: reduce) { .needle { transition: none; } }
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <h1>Accordeur</h1>
    <small id="a4tag">La = 440 Hz</small>
  </div>

  <div class="chips" id="insts" role="group" aria-label="Instrument"></div>

  <section class="panel" aria-label="Accordage">
    <div class="readout">
      <div class="note idle" id="note" aria-live="polite">–</div>
      <div class="nums">
        <span class="hz" id="hz">– Hz</span>
        <span class="ct" id="ct">– ct</span>
        <span class="tgt" id="tgt"></span>
      </div>
    </div>
    <div class="meter" aria-hidden="true">
      <div class="zone"></div>
      <div class="track"></div>
      <div class="ticks" id="ticks"></div>
      <div class="needle idle" id="needle"></div>
      <div class="scale"><span>♭ −50</span><span>0</span><span>+50 ♯</span></div>
    </div>
    <div class="status idle" id="status">Choisis une corde pour entendre la note, ou active le micro.</div>
  </section>

  <section aria-label="Cordes">
    <div class="strings" id="strings"></div>
    <p class="hint" id="hint">Touche une corde pour entendre sa note de référence. Touche-la à nouveau pour couper.</p>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" aria-label="Micro et réglages">
    <div class="row">
      <button class="btn primary grow" id="mic" aria-pressed="false">Activer le micro</button>
      <button class="btn" id="auto" aria-pressed="true">Détection auto de la corde : oui</button>
    </div>
    <p class="msg" id="msg" hidden></p>
    <div class="row">
      <span class="lbl">Diapason</span>
      <div class="stepper">
        <button id="a4minus" aria-label="Diminuer le diapason">−</button>
        <output id="a4val">440 Hz</output>
        <button id="a4plus" aria-label="Augmenter le diapason">+</button>
      </div>
      <button class="btn" id="notation" style="margin-left:auto">Do Ré Mi</button>
    </div>
  </section>
</div>

<script>
(function () {
  var NAMES_EN = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  var NAMES_FR = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
  // midi numbers, listed in the order shown on screen; k = string label
  var INSTS = [
    { id: 'guitare', label: 'Guitare', s: [[40,'6'],[45,'5'],[50,'4'],[55,'3'],[59,'2'],[64,'1']] },
    { id: 'dropd', label: 'Guitare Drop D', s: [[38,'6'],[45,'5'],[50,'4'],[55,'3'],[59,'2'],[64,'1']] },
    { id: 'basse4', label: 'Basse 4 cordes', s: [[28,'4'],[33,'3'],[38,'2'],[43,'1']] },
    { id: 'basse5', label: 'Basse 5 cordes', s: [[23,'5'],[28,'4'],[33,'3'],[38,'2'],[43,'1']] },
    { id: 'uke', label: 'Ukulélé', s: [[67,'4'],[60,'3'],[64,'2'],[69,'1']] },
    { id: 'ukebar', label: 'Ukulélé baryton', s: [[50,'4'],[55,'3'],[59,'2'],[64,'1']] },
    { id: 'mandoline', label: 'Mandoline', s: [[55,'4'],[62,'3'],[69,'2'],[76,'1']] },
    { id: 'banjo', label: 'Banjo 5 cordes', s: [[50,'4'],[55,'3'],[59,'2'],[62,'1'],[67,'5']] },
    { id: 'violon', label: 'Violon', s: [[55,'4'],[62,'3'],[69,'2'],[76,'1']] },
    { id: 'chroma', label: 'Chromatique', s: [] }
  ];

  var st = { inst: 'guitare', a4: 440, fr: true, auto: true, target: 0, micOn: false, playing: -1 };
  try {
    var saved = JSON.parse(localStorage.getItem('accordeur') || '{}');
    if (saved.inst && INSTS.some(function (i) { return i.id === saved.inst; })) st.inst = saved.inst;
    if (saved.a4 >= 415 && saved.a4 <= 466) st.a4 = saved.a4;
    if (typeof saved.fr === 'boolean') st.fr = saved.fr;
  } catch (e) {}
  function persist() { try { localStorage.setItem('accordeur', JSON.stringify({ inst: st.inst, a4: st.a4, fr: st.fr })); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var el = { insts: $('insts'), note: $('note'), hz: $('hz'), ct: $('ct'), tgt: $('tgt'), needle: $('needle'), ticks: $('ticks'),
    status: $('status'), strings: $('strings'), hint: $('hint'), mic: $('mic'), auto: $('auto'), msg: $('msg'),
    a4val: $('a4val'), a4tag: $('a4tag'), notation: $('notation') };

  function inst() { return INSTS.filter(function (i) { return i.id === st.inst; })[0]; }
  function freqOf(m) { return st.a4 * Math.pow(2, (m - 69) / 12); }
  function nameOf(m) { return (st.fr ? NAMES_FR : NAMES_EN)[((m % 12) + 12) % 12]; }
  function octOf(m) { return Math.floor(m / 12) - 1; }
  function fmtHz(f) { return f.toFixed(f < 100 ? 2 : 1).replace('.', ',') + ' Hz'; }
  // octave number only in chromatic mode; with a string list the "corde N" label is clearer
  function noteHTML(m) { return nameOf(m) + (inst().s.length ? '' : '<span class="oct">' + octOf(m) + '</span>'); }

  // ticks every 5 cents from -50 to +50
  (function () {
    var h = '';
    for (var c = -50; c <= 50; c += 5) {
      var cls = c === 0 ? 'tick mid' : (c % 10 === 0 ? 'tick big' : 'tick');
      h += '<span class="' + cls + '" style="left:' + (c + 50) + '%"></span>';
    }
    el.ticks.innerHTML = h;
  })();

  function renderInsts() {
    el.insts.innerHTML = '';
    INSTS.forEach(function (i) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = i.label; b.setAttribute('aria-pressed', i.id === st.inst ? 'true' : 'false');
      b.addEventListener('click', function () {
        stopTone(); st.inst = i.id; st.target = 0; persist(); renderAll();
      });
      el.insts.appendChild(b);
    });
  }

  function renderStrings() {
    var i = inst();
    el.strings.innerHTML = '';
    if (!i.s.length) {
      el.strings.style.display = 'none';
      el.hint.textContent = 'Mode chromatique : joue une note, l’accordeur affiche la note la plus proche (micro requis).';
      return;
    }
    el.strings.style.display = '';
    el.hint.textContent = 'Touche une corde pour entendre sa note de référence. Touche-la à nouveau pour couper.';
    i.s.forEach(function (s, idx) {
      var b = document.createElement('button');
      b.className = 'str';
      b.dataset.idx = idx;
      b.setAttribute('aria-pressed', idx === st.target ? 'true' : 'false');
      b.setAttribute('aria-label', 'Corde ' + s[1] + ', ' + nameOf(s[0]) + ' ' + octOf(s[0]));
      b.innerHTML = '<span class="n">' + noteHTML(s[0]) + '</span><span class="k">corde ' + s[1] + '</span>';
      b.addEventListener('click', function () {
        st.target = idx;
        if (st.playing === idx) stopTone(); else startTone(idx);
        markStrings(); showIdle();
      });
      el.strings.appendChild(b);
    });
  }

  function markStrings(okIdx) {
    var nodes = el.strings.querySelectorAll('.str');
    for (var k = 0; k < nodes.length; k++) {
      nodes[k].setAttribute('aria-pressed', k === st.target ? 'true' : 'false');
      nodes[k].classList.toggle('playing', k === st.playing);
      nodes[k].classList.toggle('hit-ok', k === okIdx);
    }
  }

  function setNeedle(cents, cls) {
    var c = Math.max(-50, Math.min(50, cents));
    el.needle.style.transform = 'translateX(' + (el.needle.parentNode.clientWidth * (c + 50) / 100) + 'px)';
    el.needle.className = 'needle' + (cls ? ' ' + cls : '');
  }

  function showIdle(msg) {
    var i = inst();
    el.note.className = 'note idle';
    if (i.s.length) {
      var m = i.s[st.target][0];
      el.note.innerHTML = noteHTML(m);
      el.tgt.textContent = 'cible ' + fmtHz(freqOf(m));
      el.hz.textContent = fmtHz(freqOf(m));
      el.ct.textContent = st.playing >= 0 ? 'note de référence' : '– ct';
    } else {
      el.note.textContent = '–'; el.tgt.textContent = ''; el.hz.textContent = '– Hz'; el.ct.textContent = '– ct';
    }
    setNeedle(0, 'idle');
    el.status.className = 'status idle';
    el.status.textContent = msg || (st.playing >= 0 ? 'Accorde ta corde sur cette note.' : (st.micOn ? 'Joue une corde à vide…' : 'Choisis une corde pour entendre la note, ou active le micro.'));
    markStrings();
  }

  function renderAll() {
    renderInsts(); renderStrings();
    el.a4val.textContent = st.a4 + ' Hz';
    el.a4tag.textContent = nameOf(69) + ' = ' + st.a4 + ' Hz';
    el.notation.textContent = st.fr ? 'Do Ré Mi' : 'A B C';
    showIdle();
  }

  /* ---------- reference tone ---------- */
  var ac = null, toneNodes = null, toneTimer = null;
  function ctx() {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function startTone(idx) {
    stopTone();
    var a = ctx(); if (!a) return;
    var f = freqOf(inst().s[idx][0]);
    var master = a.createGain(); master.gain.value = 0;
    master.connect(a.destination);
    var parts = [[1, 'triangle', 0.5]];
    // phone speakers barely reproduce very low notes, so low notes get upper partials
    if (f < 160) { parts.push([2, 'sine', 0.3]); parts.push([3, 'sine', 0.18]); }
    var oscs = parts.map(function (p) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = p[1]; o.frequency.value = f * p[0]; g.gain.value = p[2];
      o.connect(g); g.connect(master); o.start(); return o;
    });
    master.gain.setTargetAtTime(0.55, a.currentTime, 0.02);
    toneNodes = { master: master, oscs: oscs };
    st.playing = idx;
    toneTimer = setTimeout(function () { stopTone(); showIdle(); }, 10000);
  }
  function stopTone() {
    clearTimeout(toneTimer);
    if (toneNodes && ac) {
      var n = toneNodes; toneNodes = null;
      n.master.gain.setTargetAtTime(0, ac.currentTime, 0.03);
      setTimeout(function () { n.oscs.forEach(function (o) { try { o.stop(); } catch (e) {} }); n.master.disconnect(); }, 200);
    }
    st.playing = -1;
    markStrings();
  }

  /* ---------- microphone pitch detection (YIN) ---------- */
  var stream = null, src = null, analyser = null, buf = null, timer = null, lastHeard = 0, hist = [];

  function yin(data, sr, minF, maxF) {
    var tauMax = Math.min(Math.floor(sr / minF), Math.floor(data.length / 2) - 1);
    var tauMin = Math.max(2, Math.floor(sr / maxF));
    var W = Math.min(Math.floor(data.length / 2), tauMax * 2);
    var d = new Float32Array(tauMax + 1), tau, j, diff;
    for (tau = 1; tau <= tauMax; tau++) {
      var sum = 0;
      for (j = 0; j < W; j++) { diff = data[j] - data[j + tau]; sum += diff * diff; }
      d[tau] = sum;
    }
    var run = 0, cm = new Float32Array(tauMax + 1);
    cm[0] = 1;
    for (tau = 1; tau <= tauMax; tau++) { run += d[tau]; cm[tau] = run ? d[tau] * tau / run : 1; }
    var best = -1;
    for (tau = tauMin; tau < tauMax; tau++) {
      if (cm[tau] < 0.2) {
        while (tau + 1 < tauMax && cm[tau + 1] < cm[tau]) tau++;
        best = tau; break;
      }
    }
    if (best < 0) return -1;
    if (best >= tauMax - 1) return -1;
    var a = cm[best - 1], b = cm[best], c = cm[best + 1], den = a + c - 2 * b;
    var shift = den ? (a - c) / (2 * den) : 0;
    return sr / (best + shift);
  }

  function range() {
    var i = inst();
    if (!i.s.length) return [27, 1600];
    var ms = i.s.map(function (s) { return s[0]; });
    return [freqOf(Math.min.apply(null, ms) - 3), freqOf(Math.max.apply(null, ms) + 4)];
  }

  function tick() {
    if (!analyser || st.playing >= 0) return;
    analyser.getFloatTimeDomainData(buf);
    var rms = 0, k;
    for (k = 0; k < buf.length; k++) rms += buf[k] * buf[k];
    rms = Math.sqrt(rms / buf.length);
    var now = Date.now(), f = -1;
    if (rms > 0.0012) { var r = range(); f = yin(buf, ac.sampleRate, r[0], r[1]); }
    if (f > 0) {
      lastHeard = now;
      hist.push(f); if (hist.length > 3) hist.shift();
      var sorted = hist.slice().sort(function (x, y) { return x - y; });
      showPitch(sorted[Math.floor(sorted.length / 2)]);
    } else if (now - lastHeard > 1400) {
      hist = [];
      showIdle();
    }
  }

  function showPitch(f) {
    var i = inst(), m, tf;
    if (i.s.length) {
      // Octave errors are common on real strings (esp. low B on 5-string bass, B on guitar):
      // also try f/2 and f*2 and keep whichever lands closest to a string, with a small penalty.
      var bi = -1, bc = 1e9, bf = f;
      i.s.forEach(function (s, idx) {
        if (!st.auto && idx !== st.target) return;
        [1, 0.5, 2].forEach(function (mul) {
          var fe = f * mul, cc = Math.abs(1200 * Math.log(fe / freqOf(s[0])) / Math.LN2) + (mul === 1 ? 0 : 40);
          if (cc < bc) { bc = cc; bi = idx; bf = fe; }
        });
      });
      if (bi < 0) return;
      st.target = bi; f = bf;
      m = i.s[st.target][0]; tf = freqOf(m);
    } else {
      m = Math.round(69 + 12 * Math.log(f / st.a4) / Math.LN2); tf = freqOf(m);
    }
    var cents = 1200 * Math.log(f / tf) / Math.LN2;
    var ok = Math.abs(cents) <= 5;
    el.note.className = 'note ' + (ok ? 'ok' : 'off');
    el.note.innerHTML = noteHTML(m);
    el.hz.textContent = fmtHz(f);
    el.ct.textContent = (cents > 0 ? '+' : cents < 0 ? '−' : '') + Math.abs(Math.round(cents)) + ' ct';
    el.tgt.textContent = 'cible ' + fmtHz(tf);
    setNeedle(cents, ok ? 'ok' : '');
    el.status.className = 'status ' + (ok ? 'ok' : 'off');
    el.status.textContent = ok ? 'Juste' : (cents < 0 ? 'Trop grave : serre la corde' : 'Trop aigu : desserre la corde');
    markStrings(ok && i.s.length ? st.target : undefined);
  }

  function micMessage(text) { el.msg.textContent = text; el.msg.hidden = !text; }

  function micOff() {
    clearInterval(timer); timer = null;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (src) try { src.disconnect(); } catch (e) {}
    stream = null; src = null; analyser = null; st.micOn = false;
    el.mic.setAttribute('aria-pressed', 'false'); el.mic.textContent = 'Activer le micro';
    showIdle();
  }

  function micOn() {
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) {
      micMessage('Le micro n’est pas disponible dans cette page. Utilise les notes de référence : touche une corde et accorde à l’oreille.');
      return;
    }
    var a = ctx(); if (!a) return;
    md.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }).then(function (s) {
      stream = s; st.micOn = true;
      src = a.createMediaStreamSource(s);
      analyser = a.createAnalyser(); analyser.fftSize = 8192; analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(analyser.fftSize);
      src.connect(analyser);
      timer = setInterval(tick, 90);
      micMessage('');
      el.mic.setAttribute('aria-pressed', 'true'); el.mic.textContent = 'Micro actif : touche pour couper';
      stopTone(); showIdle();
    }).catch(function () {
      micMessage('Le micro est bloqué dans cette page (autorisation refusée ou non permise ici). Utilise les notes de référence : touche une corde et accorde à l’oreille.');
    });
  }

  el.mic.addEventListener('click', function () { if (st.micOn) micOff(); else micOn(); });
  el.auto.addEventListener('click', function () {
    st.auto = !st.auto;
    el.auto.setAttribute('aria-pressed', st.auto ? 'true' : 'false');
    el.auto.textContent = 'Détection auto de la corde : ' + (st.auto ? 'oui' : 'non');
  });
  function a4(delta) { st.a4 = Math.max(415, Math.min(466, st.a4 + delta)); persist(); if (st.playing >= 0) { var p = st.playing; stopTone(); startTone(p); } renderAll(); }
  $('a4minus').addEventListener('click', function () { a4(-1); });
  $('a4plus').addEventListener('click', function () { a4(1); });
  el.notation.addEventListener('click', function () { st.fr = !st.fr; persist(); renderAll(); });
  window.addEventListener('resize', function () { showIdle(); });

  renderAll();
})();
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
